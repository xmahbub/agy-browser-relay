<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AGY Relay</title>
    <style>
      :root {
        /* Professional developer tool palette (Linear / Raycast / VSCode dark) */
        --bg-app: #0d1117;
        --bg-subtle: #161b22;
        --bg-inset: #090d13;
        --border-subtle: #30363d;
        --border-default: #38424d;
        --text-primary: #e6edf3;
        --text-secondary: #8b949e;
        --text-muted: #6e7681;
        --accent: #58a6ff;
        --accent-hover: #79c0ff;
        --success: #3fb950;
        --warning: #d29922;
        --danger: #f85149;
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 320px;
        background-color: var(--bg-app);
        color: var(--text-primary);
        font-family: var(--font-sans);
        font-size: 12px;
        line-height: 1.5;
        padding: 12px;
        user-select: none;
      }

      /* Top Navbar */
      .nav-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--border-subtle);
        margin-bottom: 10px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .brand-icon {
        width: 20px;
        height: 20px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-subtle);
        border: 1px solid var(--border-subtle);
      }

      .brand-icon img {
        width: 14px;
        height: 14px;
      }

      .brand-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-primary);
        letter-spacing: -0.2px;
      }

      .badge {
        font-family: var(--font-mono);
        font-size: 10px;
        font-weight: 500;
        padding: 1px 6px;
        border-radius: 10px;
        border: 1px solid var(--border-subtle);
        background: var(--bg-subtle);
        color: var(--text-secondary);
      }

      /* Status Section */
      .status-box {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 10px;
        background: var(--bg-subtle);
        border: 1px solid var(--border-subtle);
        border-radius: 6px;
        margin-bottom: 10px;
      }

      .status-indicator {
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: 500;
        font-size: 12px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: var(--text-muted);
        transition: background-color 0.2s ease;
      }

      .dot.online {
        background-color: var(--success);
        box-shadow: 0 0 6px rgba(63, 185, 80, 0.4);
      }

      .dot.connecting {
        background-color: var(--warning);
      }

      .dot.offline {
        background-color: var(--danger);
      }

      .port-tag {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted);
      }

      /* Data Grid / Properties */
      .prop-grid {
        background: var(--bg-subtle);
        border: 1px solid var(--border-subtle);
        border-radius: 6px;
        overflow: hidden;
        margin-bottom: 10px;
      }

      .prop-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 10px;
        border-bottom: 1px solid var(--border-subtle);
      }

      .prop-row:last-child {
        border-bottom: none;
      }

      .prop-label {
        color: var(--text-secondary);
        font-size: 11px;
      }

      .prop-value {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-primary);
      }

      /* Action Buttons */
      .actions {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      button {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 6px;
        font-family: var(--font-sans);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      }

      .btn-primary {
        background: var(--bg-subtle);
        color: var(--text-primary);
        border: 1px solid var(--border-default);
      }

      .btn-primary:hover {
        background: #21262d;
        border-color: #8b949e;
      }

      .btn-secondary {
        background: transparent;
        color: var(--text-secondary);
        border: 1px solid var(--border-subtle);
      }

      .btn-secondary:hover {
        background: var(--bg-subtle);
        color: var(--text-primary);
        border-color: var(--border-default);
      }

      .btn-danger {
        background: rgba(248, 81, 73, 0.1);
        color: var(--danger);
        border: 1px solid rgba(248, 81, 73, 0.4);
      }

      .btn-danger:hover {
        background: rgba(248, 81, 73, 0.2);
        border-color: var(--danger);
      }

      /* Footer */
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid var(--border-subtle);
        font-size: 11px;
        color: var(--text-muted);
      }

      .footer a {
        color: var(--text-secondary);
        text-decoration: none;
        cursor: pointer;
      }

      .footer a:hover {
        color: var(--accent);
      }

      .hidden {
        display: none !important;
      }

      #error {
        margin-bottom: 8px;
        padding: 6px 8px;
        border-radius: 4px;
        background: rgba(248, 81, 73, 0.1);
        border: 1px solid rgba(248, 81, 73, 0.4);
        color: var(--danger);
        font-size: 11px;
        font-family: var(--font-mono);
      }
    </style>
  </head>
  <body>
    <div class="nav-header">
      <div class="brand">
        <div class="brand-icon">
          <img src="icons/icon32.png" alt="AGY" />
        </div>
        <span class="brand-title">AGY Browser Relay</span>
      </div>
      <span class="badge">CDP v1.3</span>
    </div>

    <div class="status-box">
      <div class="status-indicator">
        <span id="statusDot" class="dot"></span>
        <span id="status">Connecting…</span>
      </div>
      <span class="port-tag">:9223</span>
    </div>

    <div id="error" class="hidden"></div>

    <div id="pairedDetails" class="prop-grid hidden">
      <div class="prop-row">
        <span class="prop-label">Permission Scope</span>
        <span id="accessMode" class="prop-value">All Tabs</span>
      </div>
      <div class="prop-row">
        <span class="prop-label">Transport Protocol</span>
        <span class="prop-value">WebSocket / JSON-RPC</span>
      </div>
    </div>

    <div class="actions">
      <button id="tabAction" type="button" class="btn-primary hidden">
        Allow on this tab
      </button>
      <button id="settings" type="button" class="btn-secondary">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 0a8.2 8.2 0 00-1.6.16l-.2.8a2.5 2.5 0 01-1.78 1.78l-.8.2A8.2 8.2 0 003.5 4.5l.44.7a2.5 2.5 0 010 2.52l-.44.7a8.2 8.2 0 001.06 1.84l.8.2a2.5 2.5 0 011.78 1.78l.2.8a8.2 8.2 0 003.2 0l.2-.8a2.5 2.5 0 011.78-1.78l.8-.2a8.2 8.2 0 001.06-1.84l-.44-.7a2.5 2.5 0 010-2.52l.44-.7a8.2 8.2 0 00-1.06-1.84l-.8-.2a2.5 2.5 0 01-1.78-1.78l-.2-.8A8.2 8.2 0 008 0zm0 5.5a2.5 2.5 0 110 5 2.5 2.5 0 010-5z"/>
        </svg>
        Preferences & Bridge Config
      </button>
    </div>

    <div class="footer">
      <span>Antigravity Bridge</span>
      <a id="refreshLink">Reload State</a>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
